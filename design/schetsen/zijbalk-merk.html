<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yo Max zijbalk</title>

<style>
  :root {
    --gray-0: #FFFFFF; --gray-50: #F5F5F5; --gray-100: #F0F0F0; --gray-200: #E5E5E5;
    --gray-950: #121213; --green-950: #0B1F0D; --green-500: #657064;
    --elev-page: var(--gray-50); --elev-card: var(--gray-0); --separator: var(--gray-200);
    --text: var(--gray-950); --text-muted: var(--green-500); --icon-idle: var(--green-500);
    --hover-soft: rgba(11,31,13,.04); --hover-surface: rgba(11,31,13,.08);
    --r-panel: 20px; --r-row: 10px;
    --font: 'Aeonik', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--gray-100); color: var(--text); font: 400 14px/1.5 var(--font); }
  header, section { max-width: 1100px; margin: 0 auto; padding: 0 32px; }
  header { padding-top: 40px; }
  h1 { font-weight: 500; font-size: 30px; margin: 0 0 6px; }
  h2 { font-weight: 500; font-size: 19px; margin: 0; }
  p.lead, .sub { color: var(--text-muted); margin: 0 0 24px; max-width: 760px; }
  .sub { margin: 2px 0 12px; font-size: 13.5px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 28px; padding-bottom: 40px; }
  .win { background: var(--elev-page); border-radius: 14px; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 24px 60px rgba(0,0,0,.14);
         display: grid; grid-template-columns: 220px 1fr; height: 560px; overflow: hidden; }
  .side { padding: 14px 10px 14px 12px; display: flex; flex-direction: column; }
  .lights { display: flex; gap: 8px; padding: 2px 6px 16px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .lights i:nth-child(1) { background: #FF5F57; } .lights i:nth-child(2) { background: #FEBC2E; } .lights i:nth-child(3) { background: #28C840; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 18px; }
  .brand img { width: 34px; height: 34px; margin: -2px; }
  .brand b { display: block; font-weight: 500; font-size: 16px; line-height: 1.2; }
  .brand span { display: block; color: var(--text-muted); font-size: 12px; line-height: 1.3; }
  .brand a { color: var(--text-muted); text-decoration: none; display: inline-flex; align-items: center; gap: 3px; font-size: 12px; }
  .brand a:hover { color: var(--text); text-decoration: underline; }
  nav { display: flex; flex-direction: column; gap: 2px; }
  nav a { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: var(--r-row);
          color: var(--text); text-decoration: none; font-size: 13.5px; font-weight: 500; cursor: pointer; }
  nav a i { font-size: 16px; color: var(--icon-idle); }
  nav a:hover { background: var(--hover-soft); }
  nav a.on { background: var(--hover-surface); } nav a.on i { color: var(--text); }
  nav a .ext { margin-left: auto; font-size: 12px; }
  .bottom { margin-top: auto; }
  .panel { margin: 10px 10px 10px 0; background: var(--elev-card); border: 1px solid var(--separator); border-radius: var(--r-panel); padding: 28px; }
  .panel h3 { margin: 0; font-weight: 500; font-size: 24px; }
  @media (max-width: 600px) { header, section { padding: 0 16px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
